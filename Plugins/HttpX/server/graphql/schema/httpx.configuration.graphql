type HttpXConfigurationUI {
  STATUS_SLEEP: Int
  enabled: Boolean
}

type HttpXConfiguration {
  ui: HttpXConfigurationUI
  _ui: JSON
}

input HttpXConfigurationUIInput {
  STATUS_SLEEP: Int
  enabled: Boolean
}

input HttpXConfigurationInput {
  ui: HttpXConfigurationUIInput
  _ui: JSON
}

extend type Query {
  getHttpXConfiguration: HttpXConfiguration
}
extend type Mutation {
  setHttpXConfiguration(
    configuration: HttpXConfigurationInput!
  ): HttpXConfiguration
}
