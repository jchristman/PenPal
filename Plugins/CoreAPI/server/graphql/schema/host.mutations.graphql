type Mutation {
  createHost(projectID: ID!, host: HostInput!): Host!
  createHosts(projectID: ID!, hosts: [HostInput!]!): [Host]!
  createHostsFromDomains(projectID: ID!, domains: [String!]!): [Host]!
  updateHost(host: HostUpdateInput!): Host!
  removeHost(id: ID!): Boolean!
  removeHosts(ids: [ID!]!): Boolean!
}
