type Job {
  id: ID!
  name: String!
  plugin: String!
  progress: Float!
  statusText: String!
  status: String
  cancellation_request: Boolean
  stages: [JobStage!]
  created_at: String!
  updated_at: String!
  project_id: String
  metadata: JSON
  stdout: String
  stderr: String
}

type JobStage {
  name: String!
  plugin: String!
  progress: Float!
  statusText: String!
  status: String
  order: Int
  metadata: JSON
}

type JobsConnection {
  jobs: [Job!]!
  totalCount: Int!
  hasMore: Boolean!
}

input JobInput {
  name: String!
  plugin: String!
  progress: Float = 0.0
  statusText: String = ""
  status: String = "pending"
  cancellation_request: Boolean = false
  stages: [JobStageInput!]
  project_id: String
  metadata: JSON
}

input JobStageInput {
  name: String!
  plugin: String!
  progress: Float = 0.0
  statusText: String = ""
  status: String = "pending"
  order: Int
  metadata: JSON
}

input JobUpdateInput {
  name: String
  progress: Float
  statusText: String
  status: String
  cancellation_request: Boolean
  stages: [JobStageInput!]
  metadata: JSON
  stdout: String
  stderr: String
}

input JobStageUpdateInput {
  progress: Float
  statusText: String
  status: String
  metadata: JSON
}
